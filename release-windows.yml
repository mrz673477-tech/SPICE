name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./installer/build-installer.ps1 -Version ($env:RELEASE_VERSION.TrimStart('v'))

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/透明SPICE-Setup.exe').Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('dist/SHA256SUMS.txt', "$hash  透明SPICE-Setup.exe`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag 'dist/透明SPICE-Setup.exe' 'dist/SHA256SUMS.txt' `
            --title "透明 SPICE $tag" `
            --generate-notes
